services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: parlo
      POSTGRES_PASSWORD: parlo
      POSTGRES_DB: parlo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlo"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
